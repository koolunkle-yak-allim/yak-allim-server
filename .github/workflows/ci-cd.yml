name: Java CI/CD with Gradle and Jenkins

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Make gradle wrapper executable
      run: chmod +x gradlew

    - name: Build and Test with Gradle
      run: ./gradlew build

    - name: Generate Job Summary
      if: always()
      run: |
        # 테스트 결과 XML에서 실제 개수를 집계한다. 빌드가 테스트 전에 실패하면 결과 파일이 없다.
        shopt -s nullglob
        reports=(build/test-results/test/*.xml)
        count() { grep -ho " $1=\"[0-9]*\"" "${reports[@]}" | grep -o '[0-9]*' | awk '{ s += $1 } END { print s + 0 }'; }
        if [ ${#reports[@]} -eq 0 ]; then
          tests="Not run"
        else
          tests="$(count tests) run, $(count failures) failed, $(count errors) errors, $(count skipped) skipped"
        fi
        echo "### CI/CD Job Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Property | Detail |" >> $GITHUB_STEP_SUMMARY
        echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
        echo "| **Workflow** | ${{ github.workflow }} |" >> $GITHUB_STEP_SUMMARY
        echo "| **Trigger Event** | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Status** | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
        echo "| **Tests** | ${tests} |" >> $GITHUB_STEP_SUMMARY

  trigger-jenkins:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins Build
        run: |
          curl -sS --fail-with-body -X POST "${{ secrets.JENKINS_WEBHOOK_URL }}?token=${{ secrets.JENKINS_TRIGGER_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"ref": "${{ github.ref }}", "repository": "${{ github.repository }}", "commit": "${{ github.sha }}"}'
