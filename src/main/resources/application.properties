spring.application.name=api

# 배포 시 무중단 전환을 위해 종료 요청 후 진행 중인 요청을 마무리할 시간을 준다 (I6, 배포 스크립트의 드레이닝과 함께 동작).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=60s

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform
spring.jpa.hibernate.ddl-auto=create-drop

spring.h2.console.enabled=false

ocr.upload-dir=outputs/api-images
ocr.retention-minutes=60
ocr.job-retention-minutes=60
ocr.job-processing-timeout-minutes=15
ocr.n8n.webhook-url=http://localhost:5678/webhook-test/ocr
ocr.n8n.webhook-secret=${OCR_N8N_WEBHOOK_SECRET:}

notification.firebase.key-path=file:yak-allim-firebase-key.json