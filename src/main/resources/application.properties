spring.application.name=yak-allim-server

# 배포 시 무중단 전환을 위해 종료 요청 후 진행 중인 요청을 마무리할 시간을 준다 (I6, 배포 스크립트의 드레이닝과 함께 동작).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=60s

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

ocr.upload-dir=outputs/api-images
ocr.upload-retention-minutes=60
ocr.job-retention-minutes=60
ocr.job-processing-timeout-minutes=15
ocr.job-accepted-timeout-minutes=5
# 작업 상태 저장소. memory는 로컬 실행·테스트용(서버를 다시 시작하면 작업이 사라짐).
# 운영 배포는 deploy.sh가 redis로 바꾸고 Redis 주소와 Redis 헬스체크를 함께 켠다.
ocr.job-store=memory
spring.data.redis.host=localhost
spring.data.redis.port=6379
# memory 모드에서 Redis가 없어도 /actuator/health가 DOWN이 되지 않게 기본은 끈다.
management.health.redis.enabled=false
# 활성(Publish)된 워크플로우의 운영 webhook 주소. webhook-test는 편집기에서 "Listen for test event"를
# 누른 동안 한 번만 받으므로 기본값으로 쓰지 않는다. 운영 배포는 deploy.sh가 컨테이너 주소로 덮어쓴다.
ocr.n8n.webhook-url=${OCR_N8N_WEBHOOK_URL:http://localhost:5678/webhook/ocr}
ocr.n8n.webhook-secret=${OCR_N8N_WEBHOOK_SECRET:}

notification.firebase.key-path=file:yak-allim-firebase-key.json