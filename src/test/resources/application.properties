spring.profiles.active=test

spring.application.name=api

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform
spring.jpa.hibernate.ddl-auto=create-drop

spring.h2.console.enabled=true

ocr.engine.onnx.detection-model-path=classpath:models/dummy_det.onnx
ocr.engine.onnx.recognition-model-path=classpath:models/dummy_rec.onnx
ocr.engine.onnx.recognition-dictionary-path=classpath:models/korean_dict.txt
ocr.engine.onnx.detection-threshold=0.3

ocr.parser.column-separator-x-ratio=0.3125
ocr.parser.y-offset-ratio=0.0104
ocr.parser.y-deviation-threshold-ratio=0.0391
ocr.parser.medicine-min-x-ratio=0.0677
ocr.parser.medicine-max-x-ratio=0.1354

ocr.type=local
ocr.n8n.webhook-url=http://localhost:5678/webhook-test/ocr

notification.firebase.key-path=classpath:dummy-key.json
